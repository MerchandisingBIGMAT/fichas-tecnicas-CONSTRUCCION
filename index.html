<style>
:root{--bg:#eef1f6;--panel:#fff;--text:#1a2433;--muted:#5b6678;--line:#d5dce8;--blue:#0f498b;--red:#e41e25;--blue-text:#0f498b;--on-blue:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1522;--panel:#142033;--text:#e8edf5;--muted:#9aa9bf;--line:#26364d;--blue:#0f498b;--red:#e41e25;--blue-text:#9ec0ec;--on-blue:#fff}}
:root[data-theme="dark"]{--bg:#0c1522;--panel:#142033;--text:#e8edf5;--muted:#9aa9bf;--line:#26364d;--blue:#0f498b;--red:#e41e25;--blue-text:#9ec0ec;--on-blue:#fff}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Montserrat,Arial,sans-serif;font-size:14px}
.app{max-width:1200px;margin:0 auto;padding:16px}
.top{background:#0f498b;color:#fff;border-bottom:5px solid var(--red);padding:calc(18px + env(safe-area-inset-top,0px)) 20px 16px}
.top>div{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{background:#fff;border-radius:6px;padding:6px 12px;display:flex;align-items:center}
.brand img{display:block;height:44px;width:auto}
h1{font-size:22px;margin:0 0 4px;font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:.01em}
.sub{color:rgba(255,255,255,.85);margin:0;font-size:13px}
.grid{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:12px;overflow:hidden}
.card h2{display:inline-block;font-size:11px;font-weight:700;margin:-14px 0 12px -14px;padding:6px 12px;text-transform:uppercase;letter-spacing:.07em;color:#fff;background:#0f498b;border-radius:0 0 6px 0}
.stack button{display:block;width:100%;margin-bottom:8px}
.fileinfo{font-size:12px;color:var(--muted);margin:-2px 0 8px;word-break:break-word}
.fileinfo:not(.ok){display:none}
.fileinfo.ok{color:var(--text);font-weight:600}
.fileinfo.ok::before{content:"✔ ";color:var(--blue-text)}
label.file{display:block;border:1.5px dashed var(--line);border-radius:6px;padding:10px;cursor:pointer;margin-bottom:8px}
label.file b{display:block;font-size:13px}
label.file span{color:var(--muted);font-size:12px}
label.file input{display:none}
label.file:hover{border-color:var(--blue)}
label.file.ok{border-color:var(--blue);border-style:solid}
button{font:inherit;background:var(--blue);color:var(--on-blue);border:0;border-bottom:3px solid var(--red);border-radius:6px;padding:9px 14px 7px;cursor:pointer;font-weight:700}
button.sec{background:transparent;color:var(--text);border:1px solid var(--line);border-bottom:3px solid var(--blue);padding:8px 13px 6px}
button:not(:disabled):hover{filter:brightness(1.1)}
button:focus-visible,select:focus-visible{outline:2px solid var(--red);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
select{font:inherit;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px;max-width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.prog{margin-top:10px}
.prog[hidden]{display:none}
.prog .bar{height:12px;background:var(--line);border-radius:7px;overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:var(--blue);border-right:3px solid var(--red);border-radius:7px;transition:width .2s}
.prog.done .bar i{border-right-color:transparent}
.prog .t{font-size:12px;color:var(--muted);margin-top:5px}
.prog.done .t{color:var(--text);font-weight:600}
input[type=range]{accent-color:var(--blue)}
.status{font-size:12px;color:var(--muted);line-height:1.5}
.status .warn{color:var(--red);font-weight:600}
.cols{font-size:11.5px;color:var(--muted);line-height:1.6;word-break:break-word}
.cols code{background:var(--bg);padding:1px 4px;border-radius:4px}
.stage{overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;justify-content:center}
.wrap{width:calc(105mm*var(--z,1.6));height:calc(148mm*var(--z,1.6));flex:none}
.wrap:not(.cur){display:none}
.page{position:relative;width:calc(105mm*var(--k,1));height:calc(148mm*var(--k,1));background:#fff;color:#1a1a1a;overflow:hidden;transform:scale(calc(var(--z,1.6)/var(--k,1)));transform-origin:top left;box-shadow:0 2px 14px rgba(0,0,0,.18);font-family:Montserrat,Arial,sans-serif}
.page>.sc{position:absolute;left:0;top:0;width:105mm;height:148mm;transform:scale(var(--k,1));transform-origin:0 0}
.sc>*{position:absolute}
.hd{left:0;right:0;top:0;height:19.7mm;background:#0f498b}
.tipo{left:5.5mm;top:1.8mm;width:66mm;height:8.8mm;color:#fff;font-weight:700;display:block;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;line-height:8.8mm;text-transform:uppercase}
.modelo{left:5.5mm;top:10.8mm;width:62mm;height:7.4mm;color:#fff;font-weight:500;display:flex;align-items:center;overflow:hidden;line-height:1.1}
.logo{left:72mm;top:2.3mm;width:29.5mm;height:15mm;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;overflow:hidden;text-align:center}
.logo img,.img>img,.ase img,.bm{max-width:100%;max-height:100%;object-fit:contain}
.logo img{background:#fff}
.img{left:3.6mm;top:23.1mm;width:31.4mm;height:51.8mm;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2mm 2mm 6.5mm;color:#b6bccb;font-size:5pt}
.img>img{min-height:0}
.img>.rf{position:absolute;left:0;right:0;bottom:0;height:6mm;padding:0;display:flex;align-items:center;justify-content:flex-start;text-align:left;white-space:nowrap;overflow:hidden;font-weight:400;color:#4b5563}

function pageHTML(r,i){
 const img=getImg(r),lg=getLogo(r),pc=getPicto(r);
 let t='';
 for(let k=1;k<=6;k++){
  t+=`<div class="tr"><div class="td n fit" data-max="7.5" data-min="4.5">${esc(cap(pick(r,['NOMBRE_CARACTERISTICA_'+k,'NOMBRE_CARACT_'+k])))}</div><div class="td v fit" data-max="7.5" data-min="4.5">${esc(cap(pick(r,['CARACTERISTICA_'+k,'CARACT_'+k])))}</div></div>`;
 }
 return `<div class="wrap"><div class="page"><div class="sc">
  <div class="hd"></div>
  <div class="tipo fit" data-max="17" data-min="10">${esc(r.TIPOLOGIA)}</div>
  <div class="modelo fit" data-max="13" data-min="6">${esc(r.MODELO)}</div>
  <div class="logo fit" data-max="9" data-min="5">${lg?`<img src="${lg}" alt="">`:esc(r.MARCA)}</div>
  <div class="img">${img?`<img class="prod" data-i="${i}" data-o="${img}" src="${img}" alt="">`:(r.IMAGEN?'Sin imagen: '+esc(r.IMAGEN):'Sin imagen')}${pc?`<div class="pic"><img src="${pc}" alt=""></div>`:''}<div class="rf fit" data-max="6.5" data-min="4">Ref. ${esc(ln8(r.CODIGO_LN))}</div></div>
  <div class="tab">${t}</div>
  ${(()=>{const ps=getPictos(r).slice(0,6),e=!ps.length;while(ps.length<5)ps.push(null);if(ps.length<6)ps.push(ASE);return `<div class="pics">${ps.map((u,n)=>u?`<span${u===ASE?' class="as"':''}><img src="${u}" alt=""></span>`:`<span></span>`).join('')}</div>`})()}
  <div class="inc"><div class="lab">Apto para:</div><div class="txt fit" data-max="9" data-min="4">${String(r.INCLUYE||'').split(/\r?\n|;|\|/).map(x=>x.trim()).filter(Boolean).map(x=>'<div class="dl">- '+esc(cap(x))+'</div>').join('')}</div></div>
  <div class="add"><div class="lab">Añade y mejora tu compra</div><div class="txt fit" data-max="9" data-min="4">${String(r.ANADE||'').split(/\r?\n|;|\|/).map(x=>x.trim()).filter(Boolean).map(x=>'<div class="dl">- '+esc(cap(x))+'</div>').join('')}</div></div>
  <div class="ft"></div><div class="ft2"></div>
  <img class="bm" src="${BM}" alt="">
 </div><i class="cl h t"></i><i class="cl h b"></i><i class="cl v l"></i><i class="cl v r"></i></div></div>`;
}

function fit(){
 document.body.classList.add('measure');
 const k=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--k'))||1;
 const mx=el=>+el.dataset.max;
 document.querySelectorAll('.inc,.add').forEach(b=>{const t=b.querySelector('.txt'),l=b.querySelector('.lab');if(t&&l)l.style.fontSize=mx(t)+'pt'});
 document.querySelectorAll('.fit').forEach(el=>{
  let s=mx(el),m=+el.dataset.min;
  el.style.fontSize=s+'pt';
  let g=160;
  while(g-->0&&s>m&&(el.scrollHeight>el.clientHeight+1||el.scrollWidth>el.clientWidth+1)){s-=.25;el.style.fontSize=s+'pt'}
 });
 document.querySelectorAll('.tab').forEach(t=>['n','v'].forEach(c=>{
  const els=[...t.querySelectorAll('.td.'+c)];
  const m=Math.min(...els.map(e=>parseFloat(e.style.fontSize)));
  els.forEach(e=>e.style.fontSize=m+'pt');

 const isBg=i=>{const r=p[i*4],g=p[i*4+1],b=p[i*4+2];for(const c of bg){const dr=r-c[0],dg=g-c[1],db=b-c[2];if(dr*dr+dg*dg+db*db<T2)return true}return false};

 for(let y=0;y<H;y++){seed(y*W);seed(y*W+W-1)}

}
async function isolateUrl(u){

  const bb=cutout(d,W,H);
  if(bb){
   cx.putImageData(d,0,0);
   const m=Math.round(Math.max(bb[2]-bb[0],bb[3]-bb[1])*0.02);
   const X0=Math.max(0,bb[0]-m),Y0=Math.max(0,bb[1]-m),X1=Math.min(W,bb[2]+m+1),Y1=Math.min(H,bb[3]+m+1);
   const c2=document.createElement('canvas');c2.width=X1-X0;c2.height=Y1-Y0;
   c2.getContext('2d').drawImage(cv,X0,Y0,X1-X0,Y1-Y0,0,0,X1-X0,Y1-Y0);
   const blob=await new Promise(r=>c2.toBlob(r,'image/png'));
   if(blob)res=URL.createObjectURL(blob);
  }

}

async function sniff(f){

 const h=(...a)=>a.every((v,i)=>u[i]===v);
 if(h(0x89,0x50,0x4E,0x47))return 'image/png';
 if(h(0xFF,0xD8,0xFF))return 'image/jpeg';
 if(h(0x47,0x49,0x46,0x38))return 'image/gif';
 if(h(0x52,0x49,0x46,0x46)&&u[8]===0x57&&u[9]===0x45&&u[10]===0x42&&u[11]===0x50)return 'image/webp';
 if(h(0x42,0x4D))return 'image/bmp';
 return '';
}

async function saveBlob(blob,name){
 let dl=null;
 try{dl=window.claude&&claude.use?await claude.use('downloads'):null}catch(e){dl=null}
 if(dl){await dl.save({filename:name,data:blob})}
 else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
}
